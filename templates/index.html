<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }
        header { margin-bottom: 28px; }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin: 0 0 6px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0;
        }
        .editor {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: border-color 0.15s;
        }
        .editor:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        textarea {
            width: 100%;
            min-height: 180px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text);
            background: transparent;
        }
        textarea::placeholder { color: #9ca3af; }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .hint { font-size: 0.85rem; color: var(--muted); }
        .clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .clear-btn:hover {
            background: #f3f4f6;
            color: var(--text);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 28px;
        }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .stat.accent .stat-value { color: var(--accent); }
        footer {
            margin-top: 48px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
        }
        @media (max-width: 600px) {
            .container { padding: 32px 16px 60px; }
            h1 { font-size: 1.35rem; }
            .stat-value { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Text Analyzer</h1>
            <p class="subtitle">Type or paste your text — stats update instantly.</p>
        </header>

        <div class="editor">
            <textarea id="text-input" placeholder="Start typing here..." autofocus></textarea>
            <div class="toolbar">
                <span class="hint" id="status-hint">Ready</span>
                <button class="clear-btn" id="clear-btn" type="button">Clear</button>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat accent">
                <div class="stat-label">Vowels</div>
                <div class="stat-value" data-key="vowels">0</div>
            </div>
            <div class="stat accent">
                <div class="stat-label">Consonants</div>
                <div class="stat-value" data-key="consonants">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Words</div>
                <div class="stat-value" data-key="words">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Characters</div>
                <div class="stat-value" data-key="characters">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">No Spaces</div>
                <div class="stat-value" data-key="characters_no_spaces">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Sentences</div>
                <div class="stat-value" data-key="sentences">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Avg Word Len</div>
                <div class="stat-value" data-key="avg_word_length">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Top Letter</div>
                <div class="stat-value" data-key="most_common_letter">—</div>
            </div>
        </div>

        <footer>Built with Flask · runs entirely in your browser session</footer>
    </div>

    <script>
        const input = document.getElementById('text-input');
        const clearBtn = document.getElementById('clear-btn');
        const statusHint = document.getElementById('status-hint');
        const statValues = document.querySelectorAll('.stat-value');

        let debounceTimer = null;

        async function analyze(text) {
            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) throw new Error('Request failed');
                const data = await res.json();
                statValues.forEach(el => {
                    const key = el.dataset.key;
                    if (key in data) el.textContent = data[key];
                });
                statusHint.textContent = text.length > 0 ? 'Analyzed' : 'Ready';
            } catch (err) {
                statusHint.textContent = 'Error analyzing text';
            }
        }

        input.addEventListener('input', () => {
            statusHint.textContent = 'Analyzing...';
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => analyze(input.value), 150);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            input.focus();
            analyze('');
        });
    </script>
</body>
</html>
