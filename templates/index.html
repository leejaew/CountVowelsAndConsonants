<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Text Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container" id="app-root" data-max-length="{{ max_length }}">
        <header>
            <h1>Text Analyzer</h1>
            <p class="subtitle">Type or paste your text — stats update instantly.</p>
        </header>

        <div class="editor" id="editor">
            <textarea
                id="text-input"
                placeholder="Start typing here..."
                maxlength="{{ max_length }}"
                autofocus
                spellcheck="true"
                autocomplete="off"></textarea>
            <div class="toolbar">
                <span class="hint" id="status-hint">Ready</span>
                <span class="counter" id="counter">0 / {{ max_length }}</span>
                <button class="clear-btn" id="clear-btn" type="button">Clear</button>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat accent">
                <div class="stat-label">Vowels</div>
                <div class="stat-value" data-key="vowels">0</div>
            </div>
            <div class="stat accent">
                <div class="stat-label">Consonants</div>
                <div class="stat-value" data-key="consonants">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Words</div>
                <div class="stat-value" data-key="words">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Characters</div>
                <div class="stat-value" data-key="characters">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">No Spaces</div>
                <div class="stat-value" data-key="characters_no_spaces">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Sentences</div>
                <div class="stat-value" data-key="sentences">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Avg Word Len</div>
                <div class="stat-value" data-key="avg_word_length">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Top Letter</div>
                <div class="stat-value" data-key="most_common_letter">—</div>
            </div>
        </div>

        <footer>Built with Flask</footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
